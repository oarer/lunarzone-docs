<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="color-scheme" content="light dark" />
	<title>lunarzone-docs</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='8' height='8' rx='2' fill='%2353dfdd'/%3E%3Crect x='13' y='13' width='8' height='8' rx='2' fill='%23a882ff'/%3E%3Cpath d='M11 7h4a2 2 0 0 1 2 2v4' fill='none' stroke='%23888' stroke-width='1.6'/%3E%3C/svg%3E" />
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<header class="topbar">
		<div class="topbar-left">
			<h1 class="brand">lunarzone-docs</h1>
			<select id="canvas-picker" class="picker" hidden aria-label="Выбор canvas"></select>
		</div>
		<div class="topbar-right">
			<a id="open-raw" class="btn-link" href="#" title="Открыть исходный .canvas" target="_blank" rel="noopener">.canvas</a>
			<button id="theme-toggle" class="btn" type="button" title="Сменить тему" aria-label="Сменить тему">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
			</button>
		</div>
	</header>

	<main id="viewer" class="viewer" aria-live="polite"></main>

	<div id="status" class="status" hidden>
		<div class="status-card">
			<div class="spinner" id="status-spinner"></div>
			<p id="status-text">Загрузка…</p>
		</div>
	</div>

	<script type="module" src="app.js"></script>
</body>
</html>
